    <path d="M51 30 L53.5 45 L46.5 45 Z"/>
    <!-- base -->
    <rect x="8" y="45" width="48" height="4" rx="1.5"/>
    <rect x="13" y="51" width="38" height="3" rx="1.5"/>
  </g>
</svg>
