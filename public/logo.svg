  <circle cx="32" cy="29" r="16" fill="#ff3838"/>
  <!-- Shaheed Minar silhouette in green -->
  <g fill="#00e67a">
    <!-- central spire -->
    <path d="M32 6 L37 45 L27 45 Z"/>
    <!-- left slanted pillar -->
    <path d="M21.5 20 L27.5 45 L18.5 45 Z"/>
    <!-- right slanted pillar -->
